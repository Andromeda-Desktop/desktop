# One blur recipe for every material, drawn by the compositor and cached while the backdrop is static.
[blur]
passes = 3
radius = 6
noise = 0.02
brightness = 1.04
contrast = 0.95
saturation = 1.25

# Liquid glass lens: refractive index of the bezel (Snell's law; crown glass 1.5).
[lens]
ior = 1.5
# Glass slab under the bezel, in bezel widths: a thicker slab bends the backdrop further at the rim.
depth = 0.5
# Glass edge hairline width, logical px (scaled by the output and ui scale).
rim_width = 1.0
# The specular rim fades from the edge to nothing over this many logical px (smoothstep): a glow, not a drawn line.
rim_falloff = 3.0
# The rim line darkens the backdrop by up to this fraction where no key light faces it, so the edge reads over a bright
# backdrop.
rim_shade = 0.2
# Pointer light added to the rim right at the pointer (the key glint peaks at 1), a Gaussian to 2 % at kPointerLightReach.
rim_pointer_boost = 0.9
# Colour fringe: red bends this fraction of the lens shift less, blue more (Apple's lens shows yellow/magenta edges).
dispersion = 0.04

# Light-scheme recipe; the shell applies it to the compositor while the shell mode is light.
[blur_light]
brightness = 1.05
contrast = 1.0
saturation = 1.8

# Drawn by the compositor (rulebook 5.4). Two shadows per level: key (y = 3/8 of blur) and contact. blur and y in px;
# opacity scales the scheme's shadow colour: over a measured backdrop it runs from _dark (black) to _light (white),
# else the scheme picks. e0 (stroke only) has no entry.
[elevation.e1]  # the lens, toggle and slider knobs
key_y = 1.0
key_blur = 2.0
key_light = 0.10
key_dark = 0.30
contact_y = 0.0
contact_blur = 0.0
contact_light = 0.0
contact_dark = 0.0
[elevation.e2]  # float plane: bar islands, dock, center island at rest
key_y = 6.0
key_blur = 32.0
key_light = 0.07
key_dark = 0.15
contact_y = 1.0
contact_blur = 6.0
contact_light = 0.03
contact_dark = 0.10
[elevation.e3]  # over plane: sheets, menus, banners, tooltips, inactive windows
key_y = 12.0
key_blur = 32.0
key_light = 0.16
key_dark = 0.40
contact_y = 2.0
contact_blur = 8.0
contact_light = 0.08
contact_dark = 0.24
[elevation.e4]  # active windows, dialogs
key_y = 24.0
key_blur = 64.0
key_light = 0.22
key_dark = 0.50
contact_y = 2.0
contact_blur = 8.0
contact_light = 0.10
contact_dark = 0.30

# Springs (rulebook 7.2), mass 1. stiffness = (2 pi / response)^2, damping = ratio to critical = 1 - bounce.
# Spatial springs may overshoot; effect springs (fade, fade_out) never do. There are no duration animations.
[spring.snap]      # response 0.26 s, bounce 0.15: lens leading edge, toggle knob, small control positions
stiffness = 584.0
damping = 0.85
[spring.trail]     # response 0.34 s, bounce 0.20: lens trailing edge
stiffness = 341.5
damping = 0.80
[spring.move]      # response 0.35 s, bounce 0.10: reflow, banner stack, tiling
stiffness = 322.3
damping = 0.90
[spring.open]      # response 0.26 s, bounce 0.10: Grow from a source
stiffness = 584.0
damping = 0.90
[spring.zoom]      # response 0.34 s, bounce 0.20: the overview opens (a full-screen zoom shows open's 0.2 % as none)
stiffness = 341.5
damping = 0.80
[spring.close]     # response 0.24 s, bounce 0: Return, dismissals
stiffness = 685.4
damping = 1.00
[spring.morph]     # response 0.46 s, bounce 0.18: center island expands
stiffness = 186.6
damping = 0.82
[spring.collapse]  # response 0.42 s, bounce 0.20: center island returns to rest
stiffness = 223.8
damping = 0.80
[spring.page]      # response 0.32 s, bounce 0.05: pages, workspaces, gesture release with velocity
stiffness = 385.5
damping = 0.95
[spring.press]     # response 0.12 s, bounce 0
stiffness = 2741.6
damping = 1.00
[spring.release]   # response 0.32 s, bounce 0.25
stiffness = 385.5
damping = 0.75
[spring.fade]      # response 0.16 s, bounce 0: opacity, colour, blur in
stiffness = 1542.1
damping = 1.00
[spring.follow]    # response 0.12 s, bounce 0: shell motion a window open or close causes (ends with the window)
stiffness = 2741.6
damping = 1.00
[spring.fade_out]  # response 0.10 s, bounce 0: opacity, colour, blur out
stiffness = 3947.8
damping = 1.00

[motion]  # rulebook 7.4 / 7.7
content_gate = 0.35      # content fades in after this fraction of the shape's travel
face_gate = 0.5          # Morph: the incoming face fades in after this fraction
return_face_gate = 0.7   # Return: the source face fades back in after this fraction of the close travel
overview_piece_scale = 0.86  # overview Zoom: workspace pieces grow from this scale as they fade in
stagger_ms = 8
stagger_max = 6
face_scale = 0.92
pour_x_share = 0.15  # panel pieces pour in from face_scale, this share of their x distance to the anchor (proto openCC)
pour_y_share = 0.2   # ... and this share of their y distance to the surface top; above ~0.25 rows overlap at face_scale
grow_min_scale = 0.05  # Grow: the piece group never scales below this toward a tiny source rect
face_blur = 8.0
press_scale_small = 0.96 # items up to 96 px
press_scale_medium = 0.98 # items up to 240 px
slop = 8.0
rubber_band = 0.55
projection_decay = 0.998
projection_decay_stepped = 0.997  # stepped pagers (workspaces): a moderate swipe advances one step (§7.7)
swipe_dim = 0.2         # workspace swipe: content opacity loss at one page of sidebar travel
open_velocity = 300.0    # px/s toward open
loading_delay_ms = 200
loading_min_ms = 400
caret_blink_ms = 530  # half a blink cycle: the text field caret and the terminal cursor
spinner_period_ms = 800  # one linear turn of the spinner arc (rulebook 9 spinner)
spinner_arc = 270.0      # degrees of the spinner ring that draw

