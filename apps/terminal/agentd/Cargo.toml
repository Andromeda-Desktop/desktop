[package]
name = "andromeda-agentd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent sessions for Andromeda Terminal: an ACP agent that runs Claude Code (fork of kkestell/claude-code-acp)"

[dependencies]
agent-client-protocol = "=2.2.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
