name: mac-gatekeeper-proof

# Step 1 of the macOS self-update (.agent/TASK-mac-update.md): on a real Mac, a running non-notarized Terminal downloads
# and unpacks a build, swaps its bundle and starts the new one; the job fails when Gatekeeper blocks or prompts.
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "URL of the Terminal zip to install and download again"
        type: string
        default: "https://github.com/Andromeda-Desktop/desktop/releases/latest/download/Andromeda-Terminal-macos-arm64.zip"
  push:
    branches: ["ci/**"]
    paths:
      - tools/macos/gatekeeper-proof.sh
      - .github/workflows/mac-gatekeeper-proof.yml

jobs:
  proof:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: brew install jq
      - name: Proof
        env:
          ZIP: ${{ inputs.zip || 'https://github.com/Andromeda-Desktop/desktop/releases/latest/download/Andromeda-Terminal-macos-arm64.zip' }}
        run: tools/macos/gatekeeper-proof.sh "$ZIP" /var/tmp/gatekeeper-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gatekeeper-proof
          path: /var/tmp/gatekeeper-proof
          if-no-files-found: ignore
