# A tag shell-vYYYY.M.N (tools/unit-version.sh shell next) releases only the shell package, for Arch and Ubuntu (release-unit.yml).
name: release-shell

on:
  push:
    tags: ["shell-v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing shell-v tag to build and publish", required: true }
      debian: { description: "Also Debian testing", type: boolean, default: false }

permissions:
  contents: write

concurrency:
  group: release-shell-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-unit.yml
    with:
      unit: shell
      tag: ${{ inputs.tag || github.ref_name }}
      debian: ${{ inputs.debian || false }}
    secrets: inherit
