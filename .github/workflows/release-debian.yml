# A tag v* builds the Debian testing debs and signs a rolling apt repository, with the deb of Link's latest release.
# Debian testing also serves sid and Kali; Debian 13 lacks libglycin-2.
# The assets go to the "debian" GitHub release (releases/download/debian/); see README.md.
name: release-debian

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }
      ref: { description: "Commit or branch to build instead of the tag, for a packaging fix", required: false }
  # release.yml: build only (pipeline), the artifacts are its to publish after its gate.
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      ref: { type: string, required: false }
      pipeline: { type: boolean, default: true }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  debian:
    name: debian
    runs-on: ubuntu-latest
    steps:
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || env.TAG }}
      - name: xwayland-satellite
        run: tools/deb-xwayland-satellite.sh testing
      # No ccache: the repo's 10 GiB of caches go to the Arch and Ubuntu releases.
      - name: Packages
        run: ANDROMEDA_CORE=1 DEB_VERSION=${TAG#v} tools/ubuntu-deb.sh --clean testing
      - name: Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Link releases on its own tags; the repository carries its latest release.
          gh release download -R Andromeda-Desktop/link -p '*_amd64.deb' -D "$RUNNER_TEMP/link" && exit 0
          echo "::warning::no Link release: this release ships without Link's debs"
      - name: Debs
        run: |
          out=$HOME/.cache/andromeda-ubuntu
          shopt -s nullglob
          mkdir apt
          for deb in "$out"/deb-testing/*.deb "$out"/xwayland-satellite-testing/*.deb "$RUNNER_TEMP"/link/*.deb; do
            name=$(basename "$deb")
            # Core release: the apps publish on their own tags (release-apps).
            [[ ! $name =~ ^andromeda-(files|player|viewer|terminal|libdesk)_ ]] || continue
            cp "$deb" "apt/${name//:/.}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-testing
          path: apt/

  publish:
    needs: [debian]
    if: ${{ !inputs.pipeline }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || env.TAG }}
          sparse-checkout: |
            tools/repo-publish.sh
            tools/repo-check.py
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: apt-testing, path: apt-debian }
      # Merges into the index (tools/repo-publish.sh): the apps publish on their own tags, and a replace would drop them.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          gh release view debian --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create debian --repo "$GITHUB_REPOSITORY" \
            --latest=false --title "Debian apt repository" --notes "Rolling apt repository for Debian testing, sid and Kali. See README.md."
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          src/tools/repo-publish.sh apt debian apt-debian
