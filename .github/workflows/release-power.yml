# A tag power-vYYYY.M.N (tools/unit-version.sh power next) releases only the power package, for Arch and Ubuntu (release-unit.yml).
name: release-power

on:
  push:
    tags: ["power-v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing power-v tag to build and publish", required: true }
      debian: { description: "Also Debian testing", type: boolean, default: false }

permissions:
  contents: write

concurrency:
  group: release-power-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-unit.yml
    with:
      unit: power
      tag: ${{ inputs.tag || github.ref_name }}
      debian: ${{ inputs.debian || false }}
    secrets: inherit
