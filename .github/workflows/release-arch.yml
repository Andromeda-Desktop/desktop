# A tag vYYYY.M.N (tools/unit-version.sh core next) builds the core packages (everything but the apps, which release
# on their own tags) and merges them into the pacman repository of the rolling release `repo`, which stays Latest so
# users keep releases/latest/download (see README.md). The tag's own release holds the notes and its packages.
# Run it by hand with a tag to rebuild only that part.
name: release-arch

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }
      ref: { description: "Commit or branch to build instead of the tag, for a packaging fix", required: false }
      prebuilt: { description: "Sign the packages already on the release instead of building them", type: boolean, default: false }
      only: { description: "Build and publish only these parts (\"compositor shell\"); the repository keeps the others", required: false }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  ONLY: ${{ inputs.only }}

jobs:
  # A tag's run may restore main's caches but saves only for that tag, which no later release can read. The tag
  # starts the build on main instead (GITHUB_TOKEN may dispatch), so its ccache serves the next releases.
  relay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-arch.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  packages:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git ccache zstd github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || env.TAG }}
      # makepkg's ccache option compiles through ccache; LTO objects cache too, only the final link reruns.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.prebuilt }}
        with:
          path: .ccache
          key: ccache-release-arch-${{ github.run_id }}
          restore-keys: ccache-release-arch-
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          # No limit while building: a trim mid-build would drop entries this build has not reached yet.
          mkdir -p .ccache && echo 'max_size = 0' > .ccache/ccache.conf
          chown -R builder: "$GITHUB_WORKSPACE"
          sed -i 's/^BUILDENV=(\(.*\)!ccache/BUILDENV=(\1ccache/' /etc/makepkg.conf
      # Under fakeroot cargo resolves its home from the faked root uid; meson install reruns the stale cargo targets.
      - name: Packages
        if: ${{ !inputs.prebuilt }}
        working-directory: pkg
        run: >
          sudo -u builder env HOME=/home/builder CARGO_HOME=/home/builder/.cargo ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE"
          ANDROMEDA_CORE=1 ANDROMEDA_ONLY="$ONLY" CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" ANDROMEDA_VERSION="${TAG#v}"
          makepkg --syncdeps --noconfirm --force
      # The repo's caches share 10 GiB: trim to 2G, least recently used first, so this build's entries stay.
      - name: Trim ccache
        if: always() && !inputs.prebuilt
        run: ccache -d .ccache --max-size=2G --cleanup > /dev/null
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && !inputs.prebuilt
        with:
          path: .ccache
          key: ccache-release-arch-${{ github.run_id }}
      # A local build uploads its packages to the release first (gh release upload); this only signs them.
      - name: Prebuilt packages
        if: ${{ inputs.prebuilt }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.pkg.tar.zst' -D pkg
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          # The apps release on their own tags: a core build would put its version on their packages.
          mkdir core
          for package in pkg/*.pkg.tar.zst; do
            [[ $(basename "$package") =~ ^andromeda-(files|player|viewer|terminal)-git- ]] || cp "$package" core/
          done
          # Link releases on its own tags; the repository carries its latest release.
          gh release download -R Andromeda-Desktop/link -p 'andromeda-link-[0-9]*-x86_64.pkg.tar.zst' -D core \
            || echo "::warning::no Link release: this release ships without Link"
          tools/repo-publish.sh arch repo core
          # upload-artifact rejects ':' in a path: the epoch in the file name becomes '.', as release assets name it.
          for package in core/*:*.pkg.tar.zst; do name=$(basename "$package"); mv "$package" "core/${name//:/.}"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core
          path: core/

  publish:
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            install.sh
            andromeda-release.asc
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core, path: core }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest=false || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber core/* src/install.sh src/andromeda-release.asc
