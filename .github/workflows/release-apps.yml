# A tag libdesk-v* builds the libdesk release unit and adds
# its packages to the repositories the desktop releases serve: the pacman and Ubuntu apt repository of the rolling
# release `repo` (Latest, so releases/latest/download) and the Debian apt repository (releases/download/debian). The app's
# own release holds its Arch packages and is never marked latest. The tag is <app>-vYYYY.M.N from tools/unit-version.sh <app> next.
# libdesk-v* releases libdesk, Files, Terminal, Player, Viewer and Link app together (appd modules on libdesk shared); the preview releases with the core.
# A v* release with the app package split must exist first: andromeda 0.2.8 and older own the app files.
# Dry run: run by hand with publish off; the packages stay as workflow artifacts.
name: release-apps

on:
  push:
    tags: ["libdesk-v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "App tag (files-v0.1.0); it must exist unless ref is set", required: true }
      ref: { description: "Commit or branch to build instead of the tag", required: false }
      publish: { description: "Publish to the releases and repositories", type: boolean, default: true }

permissions:
  contents: write

# tools/repo-publish.sh locks each shared index, so runs of different apps build and publish side by side; one group
# per tag only stops a second run of the same tag. (A shared group keeps one pending run and cancels the rest.)
concurrency:
  group: release-apps-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.version.outputs.app }}
      version: ${{ steps.version.outputs.version }}
      units: ${{ steps.version.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - id: version
        run: |
          # The tag holds the computed version (tools/unit-version.sh next); packages and binaries take it from here.
          app=${TAG%%-v*} version=${TAG#*-v}
          [[ $version =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "::error::$TAG is not <app>-vYYYY.M.N"; exit 1; }
          # The appd module apps link libdesk shared and pin its exact version: they release with libdesk, from one
          # commit, with one version (tools/unit-version.sh libdesk next), in one repository upload.
          case $app in
            files|terminal|player|viewer|link-app) echo "::error::$app releases with libdesk: push libdesk-v$(tools/unit-version.sh libdesk next)"; exit 1 ;;
            libdesk) units="libdesk files terminal player viewer link-app" ;;
            *) units=$app ;;
          esac
          # The release pages of the module apps carry their own tags at the same commit; a tag pushed with the
          # workflow token starts no other run.
          if [[ $app == libdesk && $PUBLISH == true ]]; then
            for unit in files terminal player viewer link-app; do
              tag=$unit-v$version
              if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
                git tag "$tag" HEAD
                git push origin "refs/tags/$tag"
              fi
              [[ $(git rev-parse "$tag^{commit}") == $(git rev-parse HEAD) ]] || { echo "::error::$tag is not at $TAG"; exit 1; }
            done
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "units=$units" >> "$GITHUB_OUTPUT"

  # The terminal also ships as a macOS app, built and smoke-tested on a Mac.
  macos:
    needs: version
    if: needs.version.outputs.app == 'libdesk'
    uses: ./.github/workflows/check-macos.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      version: ${{ needs.version.outputs.version }}
      # Empty in a dry run: the app stays a workflow artifact.
      tag: ${{ (github.event_name == 'push' || inputs.publish) && format('terminal-v{0}', needs.version.outputs.version) || '' }}

  arch:
    needs: [version]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      ANDROMEDA_APP: ${{ needs.version.outputs.app }}
      ANDROMEDA_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git zstd github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Packages
        working-directory: pkg
        run: >
          sudo -u builder env HOME=/home/builder CARGO_HOME=/home/builder/.cargo ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE"
          ANDROMEDA_APP="$ANDROMEDA_APP" ANDROMEDA_VERSION="$ANDROMEDA_VERSION" makepkg --syncdeps --noconfirm --force
      - name: Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.version.outputs.units }}
        run: |
          for unit in $UNITS; do
            tag=$unit-v$ANDROMEDA_VERSION
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --latest=false --generate-notes \
              --notes "$(tools/release-notes.sh "$unit" "$ANDROMEDA_VERSION")" \
              || gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null
            rm -rf out && mkdir out
            for package in pkg/andromeda-"$unit"-git-*.pkg.tar.zst; do name=$(basename "$package"); cp "$package" "out/${name//:/.}"; done
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber out/*
          done
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: tools/repo-publish.sh arch repo pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: repo-out/

  deb:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["26.04", testing]
    env:
      ANDROMEDA_APP: ${{ needs.version.outputs.app }}
      DEB_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      # Link-app needs Link's latest andromeda-link, which may not be in the index yet: it is installed and published
      # with the app.
      - name: Link
        if: needs.version.outputs.app == 'libdesk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R Andromeda-Desktop/link -p 'andromeda-link_*_amd64.deb' -D "$HOME/.cache/andromeda-ubuntu/link-${{ matrix.base }}"
      - name: Packages
        run: tools/ubuntu-deb.sh --clean ${{ matrix.base }}
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          BASE: ${{ matrix.base }}
          UNITS: ${{ needs.version.outputs.units }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          if [[ $BASE == testing ]]; then target=debian; else target=repo; fi
          mkdir debs
          shopt -s nullglob
          out=$HOME/.cache/andromeda-ubuntu/deb-$BASE
          # The debs of the other packages are empty in an app build.
          for unit in $UNITS; do cp "$out/andromeda-${unit}_"*.deb debs/; done
          [[ " $UNITS " != *" link-app "* ]] || cp "$HOME/.cache/andromeda-ubuntu/link-$BASE"/andromeda-link_*.deb debs/
          tools/repo-publish.sh apt "$target" debs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.base }}
          path: repo-out/
