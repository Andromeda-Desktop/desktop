# A tag files-v*, player-v*, viewer-v* or terminal-v* builds only that app (Files and Viewer also the preview) and adds
# its packages to the repositories the desktop releases serve: the pacman and Ubuntu apt repository of the latest v* release
# (releases/latest/download) and the Debian apt repository (releases/download/debian). The app's own release holds
# its Arch packages and is never marked latest. The tag is <app>-vYYYY.M.N from tools/unit-version.sh <app> next.
# A v* release with the app package split must exist first: andromeda 0.2.8 and older own the app files.
# Dry run: run by hand with publish off; the packages stay as workflow artifacts.
name: release-apps

on:
  push:
    tags: ["files-v*", "player-v*", "viewer-v*", "terminal-v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "App tag (files-v0.1.0); it must exist unless ref is set", required: true }
      ref: { description: "Commit or branch to build instead of the tag", required: false }
      publish: { description: "Publish to the releases and repositories", type: boolean, default: true }

permissions:
  contents: write

# tools/repo-publish.sh locks each shared index, so runs of different apps build and publish side by side; one group
# per tag only stops a second run of the same tag. (A shared group keeps one pending run and cancels the rest.)
concurrency:
  group: release-apps-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.version.outputs.app }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - id: version
        run: |
          # The tag holds the computed version (tools/unit-version.sh next); packages and binaries take it from here.
          app=${TAG%%-v*} version=${TAG#*-v}
          [[ $version =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "::error::$TAG is not <app>-vYYYY.M.N"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  arch:
    needs: [version]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      ANDROMEDA_APP: ${{ needs.version.outputs.app }}
      ANDROMEDA_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git zstd github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Packages
        working-directory: pkg
        run: >
          sudo -u builder env HOME=/home/builder CARGO_HOME=/home/builder/.cargo ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE"
          ANDROMEDA_APP="$ANDROMEDA_APP" ANDROMEDA_VERSION="$ANDROMEDA_VERSION" makepkg --syncdeps --noconfirm --force
      - name: Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest=false \
            || gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null
          mkdir out
          for package in pkg/*.pkg.tar.zst; do name=$(basename "$package"); cp "$package" "out/${name//:/.}"; done
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: tools/repo-publish.sh arch "$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)" pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: repo-out/

  deb:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["26.04", testing]
    env:
      ANDROMEDA_APP: ${{ needs.version.outputs.app }}
      DEB_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - name: Packages
        run: tools/ubuntu-deb.sh --clean ${{ matrix.base }}
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          BASE: ${{ matrix.base }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          # Ubuntu's apt repository is the latest v* release; Debian's is the rolling "debian" release.
          if [[ $BASE == testing ]]; then target=debian; else target=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          mkdir debs
          shopt -s nullglob
          out=$HOME/.cache/andromeda-ubuntu/deb-$BASE
          cp "$out/andromeda-${ANDROMEDA_APP}_"*.deb debs/
          # The preview deb of any other app build is empty.
          [[ ! $ANDROMEDA_APP =~ ^(files|viewer)$ ]] || cp "$out/andromeda-preview_"*.deb debs/
          tools/repo-publish.sh apt "$target" debs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.base }}
          path: repo-out/
