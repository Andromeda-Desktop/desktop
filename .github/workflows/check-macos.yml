name: check-macos

# Builds "Andromeda Terminal.app" on a Mac with the same scripts as the Linux cross-build, then runs it:
# shell input and output through `ctl`, and an app restart with the session kept by ptyd.
# release-apps.yml calls it for a terminal-v* tag: then the zipped app goes into that tag's release.
on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      version: { description: "Release version YYYY.M.N", type: string, required: true }
      tag: { description: "Release to upload the app to; empty: no upload", type: string, required: false, default: "" }
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - apps/terminal/**
      - libdesk-ui/**
      - libdesk-app/**
      - libdesk-term/**
      - tools/macos/**
      - tools/build-libghostty.sh
      - .github/workflows/check-macos.yml

jobs:
  terminal:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tools/unit-version.sh counts from the last tag
          ref: ${{ inputs.ref || github.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with: { version: 0.17.1 }
      - name: Tools
        run: |
          brew install meson ninja llvm lld pkgconf librsvg jq ncurses coreutils gnu-sed
          # The scripts call GNU sed and sha256sum, and the LLVM Mach-O tools by their Linux names. Compiling stays
          # with Apple clang: brew clang brings its own libc++ headers.
          mkdir -p /tmp/llvm-tools
          for tool in llvm-otool llvm-install-name-tool llvm-strip llvm-ar llvm-nm; do
            ln -s "$(brew --prefix)/opt/llvm/bin/$tool" /tmp/llvm-tools/
          done
          echo /tmp/llvm-tools >> "$GITHUB_PATH"
          for dir in lld/bin ncurses/bin coreutils/libexec/gnubin gnu-sed/libexec/gnubin; do
            echo "$(brew --prefix)/opt/$dir" >> "$GITHUB_PATH"
          done
          # The stb of the Arch package; later upstream commits move stb_image_resize2.h to deprecated/.
          git clone -q https://github.com/nothings/stb /tmp/stb-src
          git -C /tmp/stb-src checkout -q 31c1ad37456438565541f4919958214b6e762fb4
          mkdir -p /tmp/stb && cp /tmp/stb-src/*.h /tmp/stb/
      - name: Dependencies
        run: DARWIN_SDK=$(xcrun --show-sdk-path) STB_INCLUDE=/tmp/stb tools/macos/deps.py
      - name: Bundle
        env:
          ANDROMEDA_VERSION: ${{ inputs.version }}
        run: tools/macos/terminal.sh
      - name: Smoke
        run: tools/macos/smoke.sh
      - name: Metal probe
        if: always()
        continue-on-error: true
        run: |
          out=/var/tmp/andromeda-macos/smoke
          app="/var/tmp/andromeda-macos/Andromeda Terminal.app"
          exe="$app/Contents/MacOS/andromeda-terminal"
          system_profiler SPDisplaysDataType | tee "$out/displays.txt"
          printf 'import Metal\nprint("metal device:", MTLCreateSystemDefaultDevice()?.name ?? "none")\n' > /tmp/m.swift
          swift /tmp/m.swift | tee "$out/metal.txt" || true
          pkill -x andromeda-terminal || true
          pkill -x andromeda-ptyd || true
          ANGLE_DEFAULT_PLATFORM=metal "$exe" > "$out/terminal-metal.log" 2>&1 &
          for i in $(seq 60); do grep -q 'first frame at' "$out/terminal-metal.log" && break; sleep 1; done
          sleep 2
          screencapture -x "$out/metal.png" || true
          grep -E 'vendor|first frame|ERR|error' "$out/terminal-metal.log" || true
          pkill -x andromeda-terminal || true
      - name: Pack
        if: always()
        run: |
          app="/var/tmp/andromeda-macos/Andromeda Terminal.app"
          [ -d "$app" ] && ditto -c -k --keepParent "$app" /var/tmp/andromeda-macos/smoke/Andromeda-Terminal.zip || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terminal-macos
          path: /var/tmp/andromeda-macos/smoke
          if-no-files-found: ignore
      - name: Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          zip="/var/tmp/Andromeda-Terminal-${{ inputs.version }}-macos-arm64.zip"
          cp /var/tmp/andromeda-macos/smoke/Andromeda-Terminal.zip "$zip"
          tools/release-publish.sh "$TAG" terminal "${{ inputs.version }}" "$zip"
          # The Latest release (repo) serves a fixed link to the newest Mac build: releases/latest/download/<name>.
          cp "$zip" /var/tmp/Andromeda-Terminal-macos-arm64.zip
          gh release upload repo -R "$GITHUB_REPOSITORY" --clobber /var/tmp/Andromeda-Terminal-macos-arm64.zip
