# Native symbols for crash reports, beside a release and never in its way: on the same tag it rebuilds the same
# packages with debug info (ANDROMEDA_SYMBOLS=1; C -g does not change the generated code, and the release builds
# Rust with debug info too), waits for the release's own packages, uploads andromeda-symbols-<tag>-x86_64.tar to that
# release only when every binary's .text matches, and fails alone otherwise. Map a crash offset with: addr2line -f -C -e <unpacked debug file> 0x<offset>.
name: release-symbols
on:
  push:
    tags: ["v[0-9]*", "compositor-v*", "shell-v*", "portal-v*", "greeter-v*", "power-v*", "system-v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Released tag to make symbols for", required: true }
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  symbols:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 240
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git zstd github-cli binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - name: Unit
        run: |
          # vYYYY.M.N is the core release (every core part); <unit>-vYYYY.M.N releases that unit alone.
          if [[ $TAG == v* ]]; then only=; version=${TAG#v}; else only=${TAG%%-v*}; version=${TAG#*-v}; fi
          echo "ANDROMEDA_ONLY=$only" >> "$GITHUB_ENV"
          echo "ANDROMEDA_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Packages
        working-directory: pkg
        run: >
          sudo -u builder env HOME=/home/builder CARGO_HOME=/home/builder/.cargo ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE"
          ANDROMEDA_CORE=1 ANDROMEDA_SYMBOLS=1 ANDROMEDA_ONLY="$ANDROMEDA_ONLY" ANDROMEDA_VERSION="$ANDROMEDA_VERSION"
          makepkg --syncdeps --noconfirm --force
      - name: Release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release workflow publishes on its own schedule: wait up to 3 h for its packages.
          mkdir released
          for _ in $(seq 180); do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.pkg.tar.zst' -D released --skip-existing 2> /dev/null \
              && compgen -G 'released/*.pkg.tar.zst' > /dev/null && break
            sleep 60
          done
          compgen -G 'released/*.pkg.tar.zst' > /dev/null || { echo "::error::$TAG has no released packages"; exit 1; }
      - name: Match
        run: |
          # Symbols fit a released binary only when the code is the same: compare each binary's .text.
          text() { objcopy -O binary --only-section=.text "$1" /dev/stdout 2> /dev/null | sha256sum | cut -d' ' -f1; }
          mismatch=0 compared=0
          for ours in pkg/*.pkg.tar.zst; do
            name=$(basename "$ours"); [[ $name == *-debug-* ]] && continue
            theirs=released/${name//:/.}; [[ -f $theirs ]] || continue
            rm -rf a b && mkdir a b && tar -C a -xf "$ours" && tar -C b -xf "$theirs"
            while IFS= read -r -d '' f; do
              [[ $(head -c4 "a/$f" | od -An -c | tr -d ' ') == 177ELF ]] || continue
              compared=$((compared + 1))
              [[ -f b/$f && $(text "a/$f") == $(text "b/$f") ]] && continue
              echo "::error::$f differs from the release"; mismatch=1
              mkdir -p differ && cp "a/$f" "differ/$(basename "$f").symbols" && cp "b/$f" "differ/$(basename "$f").release"
            done < <(cd a && find usr -type f -print0)
          done
          echo "$compared binaries compared"
          (( compared > 0 && mismatch == 0 ))
      # Each differing binary from both builds, to diff with objdump -d.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: differ
          path: differ/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          debug=(pkg/*-debug-*.pkg.tar.zst)
          (( ${#debug[@]} )) || { echo "::error::no debug packages"; exit 1; }
          tar -cf "andromeda-symbols-$TAG-x86_64.tar" -C pkg "${debug[@]#pkg/}"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "andromeda-symbols-$TAG-x86_64.tar"
