<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font config of a libdesk-ui .app bundle; CocoaDisplay points FONTCONFIG_FILE here. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/AssetsV2</dir>
  <dir>/System/Library/Assets</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/org.andromeda.fontconfig</cachedir>
  <include ignore_missing="yes">conf.d</include>
  <alias>
    <family>monospace</family>
    <prefer><family>SF Mono</family><family>Menlo</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>SF Pro</family><family>Helvetica Neue</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>New York</family><family>Times</family></prefer>
  </alias>
</fontconfig>
